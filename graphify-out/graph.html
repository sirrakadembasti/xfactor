    const colorMap = {
      docs: '#a855f7',
      agents: '#8b5cf6',
      engine: '#3b82f6',
      backend: '#10b981',
      frontend: '#f59e0b',
      tests: '#ef4444'
    };

    const width = window.innerWidth;
    const height = window.innerHeight;

    const svg = d3.select("svg")
      .attr("viewBox", [0, 0, width, height]);

    const g = svg.append("g");

    svg.call(d3.zoom()
      .extent([[0, 0], [width, height]])
      .scaleExtent([0.2, 4])
      .on("zoom", ({transform}) => g.attr("transform", transform)));

    const simulation = d3.forceSimulation(graph.nodes)
      .force("link", d3.forceLink(graph.links).id(d => d.id).distance(100))
      .force("charge", d3.forceManyBody().strength(-350))
      .force("center", d3.forceCenter(width / 2, height / 2))
      .force("collide", d3.forceCollide().radius(d => Math.sqrt(d.val) * 12 + 10));

    const link = g.append("g")
      .attr("class", "links")
      .selectAll("line")
      .data(graph.links)
      .join("line");

    const node = g.append("g")
      .attr("class", "nodes")
      .selectAll("circle")
      .data(graph.nodes)
      .join("circle")
      .attr("r", d => Math.sqrt(d.val) * 8 + 6)
      .attr("fill", d => colorMap[d.group] || '#94a3b8')
      .call(drag(simulation))
      .on("click", (event, d) => {
        const sidebar = document.getElementById("sidebar");
        sidebar.style.display = "block";
        document.getElementById("node-title").innerText = d.label;
        document.getElementById("node-desc").innerText = d.description || "Açıklama bulunmuyor.";
        document.getElementById("node-file").innerText = "Dosya: " + d.file;
        const typeBadge = document.getElementById("node-type");
        typeBadge.innerText = d.type;
        typeBadge.style.background = colorMap[d.group] || '#334155';
        typeBadge.style.color = 'white';
      });

    const label = g.append("g")
      .attr("class", "labels")
      .selectAll("text")
      .data(graph.nodes)
      .join("text")
      .attr("dx", 14)
      .attr("dy", 4)
      .text(d => d.label);

    simulation.on("tick", () => {
      link
        .attr("x1", d => d.source.x)
        .attr("y1", d => d.source.y)
        .attr("x2", d => d.target.x)
        .attr("y2", d => d.target.y);

      node
        .attr("cx", d => d.x)
        .attr("cy", d => d.y);

      label
        .attr("x", d => d.x)
        .attr("y", d => d.y);
    });

    function drag(simulation) {
      function dragstarted(event) {
        if (!event.active) simulation.alphaTarget(0.3).restart();
        event.subject.fx = event.subject.x;
        event.subject.fy = event.subject.y;
      }
      function dragged(event) {
        event.subject.fx = event.x;
        event.subject.fy = event.y;
      }
      function dragended(event) {
        if (!event.active) simulation.alphaTarget(0);
        event.subject.fx = null;
        event.subject.fy = null;
      }
      return d3.drag()
        .on("start", dragstarted)
        .on("drag", dragged)
        .on("end", dragended);
    }
  </script>
