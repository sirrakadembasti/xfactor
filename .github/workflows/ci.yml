name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: 'npm'
          cache-dependency-path: 'backend/package-lock.json'

      - name: Install backend dependencies
        run: |
          cd backend
          npm ci

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Install root dependencies
        run: npm ci

      - name: Backend dependency audit
        run: |
          cd backend
          timeout 60s npm audit --audit-level=high

      - name: Frontend dependency audit
        run: |
          cd frontend
          timeout 60s npm audit --audit-level=high

      - name: Run Backend & Hardening Test Suites
        env:
          P8_REQUIRE_DOCKER_LIMITS: '1'
        run: |
          cd backend
          npm test

      - name: Run frontend unit tests
        run: npm --prefix frontend run test:unit

      - name: Build frontend
        run: npm --prefix frontend run build

      - name: Install Chromium for E2E
        run: npx playwright install --with-deps chromium

      - name: Run E2E suite
        run: npm run test:e2e

  production-image:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2

      - name: Verify production image contract
        run: node scripts/test-p6-image-contract.mjs

      - name: Install production smoke dependencies
        run: npm ci

      - name: Install Chromium for production smoke
        run: npx playwright install --with-deps chromium

      - name: Prove production HTTPS container surface
        run: npm run test:production-image

      - name: Upload production smoke traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: production-image-playwright-traces
          path: test-results/
          if-no-files-found: ignore
