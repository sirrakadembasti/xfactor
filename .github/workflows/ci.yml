name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  local-worker:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
      - run: npm install --global npm@10.9.8
      - run: npm --prefix llm-yonetimi ci --ignore-scripts
      - run: npm --prefix backend ci --ignore-scripts
      - run: npm --prefix execution ci --ignore-scripts
      # Ubuntu 24.04 restricts unprivileged user namespaces via AppArmor, which Chromium's
      # sandbox needs. Enable them on the runner; the product keeps chromiumSandbox: true.
      - name: Allow Chromium sandbox user namespaces
        if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Install native Chromium
        run: node execution/node_modules/playwright-core/cli.js install --with-deps chromium
      - name: Verify native process, archive and HTTP application gates
        env:
          EXECUTION_WORKER_LOCAL_INTEGRATION: '1'
        run: node scripts/test-worker.mjs --local-integration
      - name: Package platform worker
        run: node scripts/package-local-worker.mjs --output dist/local-worker
      - name: Verify standalone package and active shutdown
        run: node scripts/test-local-worker-package.mjs --bundle dist/local-worker
      - uses: actions/upload-artifact@v4
        with:
          name: local-worker-${{ runner.os }}-${{ runner.arch }}
          path: dist/local-worker/
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: 'npm'
          cache-dependency-path: 'backend/package-lock.json'

      - name: Install reusable LLM plugin
        run: npm --prefix llm-yonetimi ci --ignore-scripts

      - name: Allow Chromium sandbox user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Install backend dependencies
        run: |
          cd backend
          npm ci

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Install root dependencies
        run: npm ci

      - name: Backend dependency audit
        run: |
          cd backend
          timeout 60s npm audit --audit-level=high

      - name: Frontend dependency audit
        run: |
          cd frontend
          timeout 60s npm audit --audit-level=high

      - name: Run Backend & Hardening Test Suites
        env:
          P8_REQUIRE_DOCKER_LIMITS: '1'
        run: |
          cd backend
          npm test

      - name: Run frontend unit tests
        run: npm --prefix frontend run test:unit

      - name: Build frontend
        run: npm --prefix frontend run build

      - name: Install Chromium for E2E
        run: npx playwright install --with-deps chromium

      - name: Run E2E suite
        run: npm run test:e2e

      - name: Verify execution worker and interactive browser
        env:
          EXECUTION_WORKER_INTEGRATION: '1'
        run: |
          cd execution
          npm ci --ignore-scripts
          npx playwright-core install --with-deps chromium
          docker build -t xfactor-worker-runtime .
          npm run test:docker

  production-image:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2

      - name: Allow Chromium sandbox user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Verify production image contract
        run: node scripts/test-p6-image-contract.mjs

      - name: Install production smoke dependencies
        run: npm ci

      - name: Install Chromium for production smoke
        run: npx playwright install --with-deps chromium

      - name: Prove production HTTPS container surface
        run: npm run test:production-image

      - name: Upload production smoke traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: production-image-playwright-traces
          path: test-results/
          if-no-files-found: ignore
